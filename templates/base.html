<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}MyKELASI{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
    <header class="site-header">
        <a class="brand" href="/">MyKELASI</a>
        <nav aria-label="Navigation principale">
            {% if user.is_authenticated %}
                <a href="{% url 'accounts:dashboard' %}">Tableau de bord</a>
                <form method="post" action="{% url 'accounts:logout' %}">
                    {% csrf_token %}
                    <button class="link-button" type="submit">Déconnexion</button>
                </form>
            {% else %}
                <a href="{% url 'accounts:login' %}">Connexion</a>
                <a href="{% url 'accounts:register' %}">Inscription</a>
            {% endif %}
        </nav>
    </header>
    <main class="page-shell">
        {% for message in messages %}<p class="message">{{ message }}</p>{% endfor %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
