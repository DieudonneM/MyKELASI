{% extends "base.html" %}
{% block title %}Analytics produit | MyKELASI{% endblock %}
{% block content %}<section><h1>Analytics produit</h1><form method="get"><label>Du <input type="date" name="from" value="{{ request.GET.from }}"></label><label>Au <input type="date" name="to" value="{{ request.GET.to }}"></label><label>Matière <select name="subject"><option value="">Toutes</option>{% for item in subjects %}<option value="{{ item.pk }}"{% if request.GET.subject == item.pk|stringformat:"s" %} selected{% endif %}>{{ item.name }}</option>{% endfor %}</select></label><label>Zone <select name="service_area"><option value="">Toutes</option>{% for item in service_areas %}<option value="{{ item.pk }}"{% if request.GET.service_area == item.pk|stringformat:"s" %} selected{% endif %}>{{ item.name }}</option>{% endfor %}</select></label><button type="submit">Filtrer</button></form><dl>{% for key, value in kpis.items %}<div><dt>{{ key }}</dt><dd>{{ value }}</dd></div>{% endfor %}</dl></section>{% endblock %}
