{% extends "base.html" %}
{% block title %}Connexion | MyKELASI{% endblock %}
{% block content %}
<section class="auth-panel">
    <h1>Connexion</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
        <button class="primary" type="submit">Se connecter</button>
    </form>
    <div class="actions">
        <a href="{% url 'accounts:password-reset' %}">Mot de passe oublié</a>
        <a href="{% url 'accounts:register' %}">Créer un compte</a>
    </div>
</section>
{% endblock %}
