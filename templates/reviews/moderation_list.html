{% extends "base.html" %}
{% block title %}Modération des avis | MyKELASI{% endblock %}
{% block content %}<section><h1>Avis</h1>{% for review in reviews %}<article><h2><a href="{% url 'reviews:moderation-detail' review.public_id %}">{{ review.rating }}/5 · {{ review.get_status_display }}</a></h2><p>{{ review.comment }}</p></article>{% empty %}<p>Aucun avis.</p>{% endfor %}</section>{% endblock %}
