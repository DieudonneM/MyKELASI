name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: mykelasi_test
          POSTGRES_USER: mykelasi
          POSTGRES_PASSWORD: mykelasi_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mykelasi -d mykelasi_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SECRET_KEY: ci-only-secret-key-not-for-production
      DJANGO_ENV: development
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: localhost
      POSTGRES_DB: mykelasi_test
      POSTGRES_USER: mykelasi
      POSTGRES_PASSWORD: mykelasi_ci_password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: ruff check .
      - run: python manage.py check
      - run: python manage.py migrate --noinput
      - run: pytest
