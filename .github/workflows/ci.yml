name: CI

on:
  push:
  pull_request:

jobs:
  django_test:
    name: Django Web & API Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: mykelasi_test
          POSTGRES_USER: mykelasi
          POSTGRES_PASSWORD: mykelasi_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mykelasi -d mykelasi_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SECRET_KEY: mykelasi-ci-security-check-long-random-placeholder-value-2026
      DJANGO_ENV: test
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: localhost
      DJANGO_CSRF_TRUSTED_ORIGINS: https://localhost
      DJANGO_SECURE_HSTS_SECONDS: "31536000"
      POSTGRES_DB: mykelasi_test
      POSTGRES_USER: mykelasi
      POSTGRES_PASSWORD: mykelasi_ci_password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - run: git diff --check
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python manage.py check
      - run: python manage.py check --deploy
        env:
          DJANGO_ENV: staging
          DJANGO_SETTINGS_MODULE: app_core.settings
      - run: python manage.py migrate --noinput
      - run: pytest --cov=. --cov-report=term-missing --cov-report=xml:coverage.xml
      - run: pytest accounts/tests/test_users.py verification/tests/test_documents.py
      - run: pytest payments/tests/test_payments.py
      - uses: actions/upload-artifact@v4
        with:
          name: django-coverage
          path: coverage.xml
          if-no-files-found: error
