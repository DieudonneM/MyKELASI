[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "app_core.settings.test"
python_files = ["test_*.py", "*_test.py"]
addopts = "--cov=app_core --cov-report=term-missing"

[tool.ruff]
target-version = "py314"
line-length = 100
exclude = [".venv", "migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
